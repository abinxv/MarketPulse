services:
  db:
    image: pgvector/pgvector:pg16
    container_name: marketpulse-db
    environment:
      POSTGRES_USER: mp
      POSTGRES_PASSWORD: mp
      POSTGRES_DB: marketpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp -d marketpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
